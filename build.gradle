import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Official Mojang mappings
    mappings channel: 'official', version: project.minecraft_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
    inputs.property "version", project.version
    // ReplaceTokens (@version@) instead of expand(): expand() runs the file through Groovy's
    // template engine, which chokes on the literal "$Resource$" in the CC BY credit line.
    filesMatching("META-INF/mods.toml") {
        filter(ReplaceTokens, tokens: [version: project.version.toString()])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from("CREDITS.md")
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : 'You',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'You'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(Jar).configureEach {
    // keep the jar names predictable
}
